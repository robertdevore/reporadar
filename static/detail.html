<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Detail — RepoRadar</title>
<link rel="stylesheet" href="/style.css">
<style>
.detail-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
@media (max-width: 900px) { .detail-layout { grid-template-columns: 1fr; } }
.card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
.card h3 { margin-bottom: 12px; font-size: 14px; color: var(--text-secondary); }
.card-full { grid-column: 1 / -1; }
.info-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
.info-label { color: var(--text-muted); }
.info-value { color: var(--text-primary); max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.file-list { font-family: monospace; font-size: 12px; }
.file-item { padding: 3px 0; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 6px; }
.file-status { min-width: 20px; font-weight: 600; }
.file-status.M { color: var(--accent-orange); }
.file-status.A { color: var(--accent-green); }
.file-status.D { color: var(--accent-red); }
.file-status.\? { color: var(--text-muted); }
.commit-list { font-size: 13px; }
.commit-item { padding: 6px 0; border-bottom: 1px solid var(--border-color); }
.commit-hash { font-family: monospace; color: var(--accent-blue); font-size: 12px; }
.commit-msg { color: var(--text-primary); }
.commit-meta { color: var(--text-muted); font-size: 12px; }
.nav-back { margin-bottom: 16px; }
.nav-back a { color: var(--accent-blue); text-decoration: none; }
</style>
</head>
<body>
<div id="app" style="max-width:1200px;margin:0 auto;padding:0 24px 48px;">
  <header class="header">
    <div class="header-left">
      <h1 class="logo">🔭 RepoRadar</h1>
      <span class="version">v0.1.0</span>
    </div>
    <div class="header-right">
      <a href="/" class="btn btn-ghost">← Dashboard</a>
    </div>
  </header>

  <div class="nav-back"><a href="/">← Back to Dashboard</a></div>

  <div id="loading-state" class="loading-state"><div class="spinner"></div><p>Loading repo details...</p></div>
  <div id="error-state" class="error-state hidden"><div class="error-icon">⚠</div><h2>Repository not found</h2><p id="error-msg"></p><a href="/" class="btn btn-primary">Back to Dashboard</a></div>
  <div id="detail-content" class="hidden"></div>
</div>
<script src="/detail.js"></script>
</body>
</html>
