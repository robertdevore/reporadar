<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Detail — RepoRadar</title>
<link rel="stylesheet" href="/style.css">

</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-left">
      <h1 class="logo"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg> RepoRadar</h1>
      <span class="version">v0.5.0</span>
    </div>
    <div class="header-right">
      <a href="/" class="btn btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Dashboard</a>
    </div>
  </header>
  <script>
    const logo = document.querySelector('.logo');
    logo.setAttribute('role', 'link');
    logo.setAttribute('tabindex', '0');
    logo.addEventListener('click', () => { window.location.href = '/'; });
    logo.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        window.location.href = '/';
      }
    });
  </script>


  <div id="loading-state" class="loading-state"><div class="spinner"></div><p>Loading repo details...</p></div>
  <div id="error-state" class="error-state hidden"><div class="error-icon"><svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div><h2>Repository not found</h2><p id="error-msg"></p><a href="/" class="btn btn-primary">Back to Dashboard</a></div>
  <div id="detail-content" class="hidden"></div>
  <footer class="site-footer"><span>RepoRadar is open source on <a href="https://github.com/robertdevore/reporadar" target="_blank" rel="noopener">GitHub</a></span><span>Built by <a href="https://robertdevore.com" target="_blank" rel="noopener">Robert DeVore</a></span></footer>
</div>
<script src="/detail.js"></script>
</body>
</html>
