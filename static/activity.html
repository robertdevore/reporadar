<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity — RepoRadar</title>
<link rel="stylesheet" href="/style.css">

</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-left">
      <h1 class="logo"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg> RepoRadar</h1>
      <span class="version">v0.4.0</span>
    </div>
    <div class="header-right">
      <a href="/" class="btn btn-ghost">← Dashboard</a>
    </div>
  </header>
  <script>
    const logo = document.querySelector('.logo');
    logo.setAttribute('role', 'link');
    logo.setAttribute('tabindex', '0');
    logo.addEventListener('click', () => { window.location.href = '/'; });
    logo.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        window.location.href = '/';
      }
    });
  </script>


  <div class="window-select" id="window-btns">
    <button class="window-btn" data-days="1">1 day</button>
    <button class="window-btn" data-days="3">3 days</button>
    <button class="window-btn active" data-days="7">7 days</button>
    <button class="window-btn" data-days="14">14 days</button>
    <button class="window-btn" data-days="30">30 days</button>
    <button class="window-btn" data-days="90">90 days</button>
  </div>

  <div class="summary-cards" id="summary-cards">
    <div class="summary-card"><span class="summary-label">Total Commits</span><span class="summary-value" id="sum-total">-</span></div>
    <div class="summary-card"><span class="summary-label">Active Repos</span><span class="summary-value" id="sum-active">-</span></div>
    <div class="summary-card"><span class="summary-label">Stale Repos</span><span class="summary-value" id="sum-stale">-</span></div>
  </div>

  <div id="loading-state" class="loading-state"><div class="spinner"></div><p>Loading activity data...</p></div>
  <p id="history-warning" class="hidden" role="status"></p>
  <div id="activity-content" class="hidden">
    <div class="activity-layout">
      <div class="card">
        <h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg> Commits per Day</h3>
        <div id="chart-container"></div>
      </div>
      <div class="card">
        <h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;"><path d="M4 14a8 8 0 0 0 16 0c0-5-4-8-4-8s-.5 4-4 4-4-4-4-4-4 3-4 8Z"/><path d="M12 18a3 3 0 0 0 3-3c0-2-3-4-3-4s-3 2-3 4a3 3 0 0 0 3 3Z"/></svg> Most Active Repos</h3>
        <div id="most-active"></div>
      </div>
      <div class="card">
        <h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg> Least Active Repos</h3>
        <div id="least-active"></div>
      </div>
      <div class="card">
        <h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg> Stale Repos (No Activity)</h3>
        <div id="stale-repos"></div>
      </div>
      <div class="card card-full">
        <h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M8 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4"/></svg> Recent Commit Feed</h3>
        <div class="commit-feed" id="commit-feed"></div>
      </div>
    </div>
  </div>
  <footer class="site-footer"><span>RepoRadar is open source on <a href="https://github.com/robertdevore/reporadar" target="_blank" rel="noopener">GitHub</a></span><span>Built by <a href="https://robertdevore.com" target="_blank" rel="noopener">Robert DeVore</a></span></footer>
</div>
<script src="/activity.js"></script>
</body>
</html>
