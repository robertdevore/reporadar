<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Repos — RepoRadar</title>
<link rel="stylesheet" href="/style.css">

</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-left">
      <h1 class="logo"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg> RepoRadar</h1>
      <span class="version">v0.4.0</span>
    </div>
    <div class="header-right">
      <a href="/" class="btn btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Dashboard</a>
    </div>
  </header>
  <script>
    const logo = document.querySelector('.logo');
    logo.setAttribute('role', 'link');
    logo.setAttribute('tabindex', '0');
    logo.addEventListener('click', () => { window.location.href = '/'; });
    logo.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        window.location.href = '/';
      }
    });
  </script>


  <div class="discovery-container">
    <div class="discovery-panel">
      <h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;"><path d="m13 13.5 2-2.5-2-2.5"/><path d="m21 21-4.3-4.3"/><path d="M9 8.5 7 11l2 2.5"/><circle cx="11" cy="11" r="8"/></svg> Discover Git Repositories</h3>
      <p class="discovery-copy">Enter a parent directory to recursively find all Git repos.</p>
      <div class="form-group">
        <label for="discover-path">Parent Directory</label>
        <input type="text" id="discover-path" placeholder="/Users/me/projects" value="">
      </div>
      <div class="discovery-actions">
        <button class="btn btn-primary" id="btn-discover-start"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 13.5 2-2.5-2-2.5"/><path d="m21 21-4.3-4.3"/><path d="M9 8.5 7 11l2 2.5"/><circle cx="11" cy="11" r="8"/></svg> Scan Directory</button>
        <button class="btn btn-secondary" id="btn-add-selected" style="display:none;">+ Add Selected Repos</button>
      </div>
    </div>

    <div id="discover-results" class="hidden">
      <div class="result-card">
        <h3 id="result-title">Results</h3>
        <div class="select-all-row" id="select-all-row" style="display:none;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="select-all" class="result-checkbox" onchange="toggleSelectAll()">
            <span>Select All</span>
          </label>
        </div>
        <div class="result-list" id="result-list"></div>
      </div>
    </div>

    <div id="discover-loading" class="loading-state hidden">
      <div class="spinner"></div>
      <p>Scanning directory for Git repos...</p>
    </div>
  </div>
  <footer class="site-footer"><span>RepoRadar is open source on <a href="https://github.com/robertdevore/reporadar" target="_blank" rel="noopener">GitHub</a></span><span>Built by <a href="https://robertdevore.com" target="_blank" rel="noopener">Robert DeVore</a></span></footer>
</div>
<script src="/discovery.js"></script>
</body>
</html>
